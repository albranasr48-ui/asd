<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة العيادة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <div id="login-screen" class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm p-8 shadow-2xl border border-slate-100">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">تسجيل دخول الإدارة</h2>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">كلمة المرور</label>
                    <input type="password" id="admin-pass" required placeholder="كلمة المرور (123)" class="w-full px-4 py-2.5 border rounded-xl text-sm outline-none">
                </div>
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl text-sm transition">دخول</button>
            </form>
        </div>
    </div>

    <div id="admin-dashboard" class="hidden min-h-screen flex flex-col">
        <header class="bg-white border-b sticky top-0 z-30 shadow-sm">
            <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
                <h1 class="font-bold text-base text-teal-800" id="header-clinic-name">لوحة تحكم العيادة</h1>
                <button onclick="logoutAdmin()" class="bg-rose-50 text-rose-600 px-4 py-2 rounded-xl text-xs font-bold">تسجيل الخروج</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 py-6 flex-grow w-full space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                
                <!-- عمود الأقسام وإعدادات العيادة -->
                <div class="lg:col-span-6 space-y-6">
                    <section class="bg-white p-6 rounded-2xl border shadow-sm">
                        <h3 class="text-sm font-bold text-slate-800 mb-4 border-r-4 border-teal-600 pr-3">إدارة الأقسام وصورها</h3>
                        <form onsubmit="saveDepartment(event)" class="space-y-3 mb-4">
                            <input type="hidden" id="dept-id">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">اسم القسم</label>
                                <input type="text" id="dept-name" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">صورة القسم</label>
                                <input type="file" id="dept-image-file" accept="image/*" class="w-full text-xs file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-teal-50 file:text-teal-700">
                                <img id="dept-img-preview" src="" class="w-12 h-12 rounded-full mt-2 hidden object-cover border">
                            </div>
                            <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2 rounded-xl text-xs">حفظ القسم</button>
                        </form>
                        <div id="departments-list" class="space-y-2"></div>
                    </section>
                </div>

                <!-- عمود إضافة الأطباء -->
                <div class="lg:col-span-6 space-y-6">
                    <section class="bg-white p-6 rounded-2xl border shadow-sm">
                        <h3 class="text-sm font-bold text-slate-800 mb-4 border-r-4 border-teal-600 pr-3">إضافة طبيب جديد وصورته</h3>
                        <form onsubmit="saveDoctor(event)" class="space-y-3">
                            <input type="hidden" id="doc-id">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">اسم الطبيب</label>
                                <input type="text" id="doc-name" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">صورة الطبيب الشخصية</label>
                                <input type="file" id="doc-image-file" accept="image/*" class="w-full text-xs file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-teal-50 file:text-teal-700">
                                <img id="doc-img-preview" src="" class="w-12 h-12 rounded-full mt-2 hidden object-cover border">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">القسم</label>
                                    <select id="doc-dept" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none"></select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">رقم العيادة</label>
                                    <input type="text" id="doc-room" value="1" class="w-full px-3 py-2 border rounded-xl text-xs outline-none">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">اسم المستخدم</label>
                                    <input type="text" id="doc-username" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">كلمة المرور</label>
                                    <input type="password" id="doc-password" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none">
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <input type="text" id="doc-days" required placeholder="الأيام" class="px-2 py-2 border rounded-xl text-xs">
                                <input type="text" id="doc-from" required placeholder="من" class="px-2 py-2 border rounded-xl text-xs">
                                <input type="text" id="doc-to" required placeholder="إلى" class="px-2 py-2 border rounded-xl text-xs">
                            </div>
                            <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2 rounded-xl text-xs">حفظ الطبيب</button>
                        </form>

                        <div class="mt-4">
                            <h4 class="text-xs font-bold text-slate-700 mb-2">الأطباء المسجلون:</h4>
                            <div id="doctors-list" class="space-y-2"></div>
                        </div>
                    </section>
                </div>

            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://msfkzlgzrrwowzqswjeo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VrSSf2MML6_kII0uVt535w_kxtc62vQ';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let deptImageBase64 = '';
        let docImageBase64 = '';

        function handleAdminLogin(e) {
            e.preventDefault();
            if(document.getElementById('admin-pass').value === '123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadAdminData();
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        }

        function logoutAdmin() {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        async function loadAdminData() {
            document.getElementById('dept-image-file').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = evt => {
                        deptImageBase64 = evt.target.result;
                        const prev = document.getElementById('dept-img-preview');
                        prev.src = deptImageBase64;
                        prev.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('doc-image-file').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = evt => {
                        docImageBase64 = evt.target.result;
                        const prev = document.getElementById('doc-img-preview');
                        prev.src = docImageBase64;
                        prev.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });

            await renderAdminDepartments();
            await renderAdminDoctors();
        }

        async function saveDepartment(e) {
            e.preventDefault();
            const id = document.getElementById('dept-id').value;
            const name = document.getElementById('dept-name').value;

            const payload = { name, image: deptImageBase64 };

            if(id) await db.from('departments').update(payload).eq('id', id);
            else await db.from('departments').insert([payload]);

            document.getElementById('dept-name').value = '';
            document.getElementById('dept-id').value = '';
            deptImageBase64 = '';
            document.getElementById('dept-img-preview').classList.add('hidden');
            await renderAdminDepartments();
        }

        async function renderAdminDepartments() {
            const { data: depts } = await db.from('departments').select('*');
            document.getElementById('departments-list').innerHTML = (depts || []).map(d => `
                <div class="flex justify-between items-center p-2 bg-slate-50 border rounded-xl text-xs">
                    <div class="flex items-center gap-2">
                        <img src="${d.image || 'https://via.placeholder.com/30'}" class="w-8 h-8 rounded-full object-cover">
                        <span class="font-bold">${d.name}</span>
                    </div>
                    <button onclick="deleteDepartment('${d.id}')" class="text-rose-600 font-bold">حذف</button>
                </div>
            `).join('');

            document.getElementById('doc-dept').innerHTML = (depts || []).map(d => `<option value="${d.name}">${d.name}</option>`).join('');
        }

        async function deleteDepartment(id) {
            await db.from('departments').delete().eq('id', id);
            await renderAdminDepartments();
        }

        async function saveDoctor(e) {
            e.preventDefault();
            const id = document.getElementById('doc-id').value;
            const name = document.getElementById('doc-name').value;
            const department = document.getElementById('doc-dept').value;
            const room_number = document.getElementById('doc-room').value;
            const username = document.getElementById('doc-username').value;
            const password = document.getElementById('doc-password').value;
            const days = document.getElementById('doc-days').value;
            const time_from = document.getElementById('doc-from').value;
            const time_to = document.getElementById('doc-to').value;

            const payload = { name, department, room_number, username, password, days, time_from, time_to, image: docImageBase64 };

            if(id) await db.from('doctors').update(payload).eq('id', id);
            else await db.from('doctors').insert([payload]);

            e.target.reset();
            document.getElementById('doc-id').value = '';
            docImageBase64 = '';
            document.getElementById('doc-img-preview').classList.add('hidden');
            await renderAdminDoctors();
        }

        async function renderAdminDoctors() {
            const { data: doctors } = await db.from('doctors').select('*');
            document.getElementById('doctors-list').innerHTML = (doctors || []).map(d => `
                <div class="flex justify-between items-center p-2 bg-slate-50 border rounded-xl text-xs">
                    <div class="flex items-center gap-2">
                        <img src="${d.image || 'https://via.placeholder.com/30'}" class="w-8 h-8 rounded-full object-cover">
                        <div>
                            <p class="font-bold">${d.name} (${d.department})</p>
                            <p class="text-[10px] text-slate-400">عيادة: ${d.room_number || '1'}</p>
                        </div>
                    </div>
                    <button onclick="deleteDoctor('${d.id}')" class="text-rose-600 font-bold">حذف</button>
                </div>
            `).join('');
        }

        async function deleteDoctor(id) {
            await db.from('doctors').delete().eq('id', id);
            await renderAdminDoctors();
        }
    </script>
</body>
</html>
