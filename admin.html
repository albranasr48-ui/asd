<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-6">

    <!-- تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl">
            <h2 class="text-base font-bold text-slate-800 mb-3 text-center">دخول الإدارة</h2>
            <form onsubmit="handleAdminLogin(event)" class="space-y-3">
                <input type="password" id="admin-pass" required placeholder="كلمة المرور (123)" class="w-full px-3 py-2 border rounded-xl text-sm outline-none">
                <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2 rounded-xl text-sm">دخول</button>
            </form>
        </div>
    </div>

    <!-- لوحة الإدارة -->
    <div id="admin-dashboard" class="hidden max-w-md mx-auto px-4 pt-4 space-y-4">
        <div class="flex justify-between items-center bg-white p-3 rounded-xl border">
            <h1 class="font-bold text-sm text-teal-800">لوحة الإدارة</h1>
            <button onclick="logoutAdmin()" class="text-rose-600 text-xs font-bold">خروج</button>
        </div>

        <!-- الإعدادات والشعار -->
        <section class="bg-white p-4 rounded-xl border space-y-3">
            <h3 class="text-xs font-bold text-slate-700">إعدادات الموقع والشعار</h3>
            <form onsubmit="saveSettings(event)" class="space-y-2">
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">اسم العيادة</label>
                    <input type="text" id="set-name" required class="w-full px-3 py-1.5 border rounded-lg text-xs outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">ارفاق صورة الشعار</label>
                    <input type="file" id="set-logo-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-teal-50 file:text-teal-700">
                    <img id="logo-preview" src="" class="w-10 h-10 mt-2 rounded-full hidden border object-cover">
                </div>
                <button type="submit" class="w-full bg-teal-600 text-white font-bold py-1.5 rounded-lg text-xs">حفظ الإعدادات</button>
            </form>
        </section>

        <!-- الأقسام -->
        <section class="bg-white p-4 rounded-xl border space-y-3">
            <h3 class="text-xs font-bold text-slate-700">إدارة الأقسام</h3>
            <form onsubmit="saveDepartment(event)" class="flex gap-2">
                <input type="hidden" id="dept-id">
                <input type="text" id="dept-name" required placeholder="اسم القسم" class="flex-1 px-3 py-1.5 border rounded-lg text-xs outline-none">
                <button type="submit" class="bg-teal-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs">حفظ</button>
            </form>
            <div id="departments-list" class="space-y-1.5"></div>
        </section>

        <!-- الدكاترة -->
        <section class="bg-white p-4 rounded-xl border space-y-3">
            <h3 class="text-xs font-bold text-slate-700">إدارة الدكاترة</h3>
            <form onsubmit="saveDoctor(event)" class="space-y-2 text-xs">
                <input type="hidden" id="doc-id">
                <input type="text" id="doc-name" required placeholder="اسم الدكتور" class="w-full px-2.5 py-1.5 border rounded-lg">
                <select id="doc-dept" required class="w-full px-2.5 py-1.5 border rounded-lg"></select>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="doc-username" required placeholder="اسم المستخدم" class="w-full px-2.5 py-1.5 border rounded-lg">
                    <input type="password" id="doc-password" required placeholder="كلمة المرور" class="w-full px-2.5 py-1.5 border rounded-lg">
                </div>
                <input type="text" id="doc-days" required placeholder="أيام العمل (الأحد - الخميس)" class="w-full px-2.5 py-1.5 border rounded-lg">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="doc-from" required placeholder="من (08:00 ص)" class="w-full px-2.5 py-1.5 border rounded-lg">
                    <input type="text" id="doc-to" required placeholder="إلى (02:00 م)" class="w-full px-2.5 py-1.5 border rounded-lg">
                </div>
                <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2 rounded-lg text-xs">حفظ الدكتور</button>
            </form>
            <div id="doctors-list" class="space-y-2 pt-2"></div>
        </section>

        <!-- الحالات -->
        <section class="bg-white p-4 rounded-xl border space-y-3">
            <h3 class="text-xs font-bold text-slate-700">متابعة الحالات</h3>
            <div id="cases-list" class="space-y-2"></div>
        </section>
    </div>

    <script>
        const SUPABASE_URL = 'https://msfkzlgzrrwowzqswjeo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VrSSf2MML6_kII0uVt535w_kxtc62vQ';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let uploadedLogoBase64 = '';

        function handleAdminLogin(e) {
            e.preventDefault();
            if(document.getElementById('admin-pass').value === '123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadAdminData();
            } else {
                alert('كلمة المرور 123');
            }
        }

        function logoutAdmin() {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        async function loadAdminData() {
            const { data: settings } = await db.from('settings').select('*').single();
            if(settings) {
                document.getElementById('set-name').value = settings.name || '';
                if(settings.logo) {
                    uploadedLogoBase64 = settings.logo;
                    const prev = document.getElementById('logo-preview');
                    prev.src = settings.logo;
                    prev.classList.remove('hidden');
                }
            }

            document.getElementById('set-logo-file').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        uploadedLogoBase64 = evt.target.result;
                        const prev = document.getElementById('logo-preview');
                        prev.src = uploadedLogoBase64;
                        prev.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });

            await renderAdminDepartments();
            await renderAdminDoctors();
            await renderAdminCases();
        }

        async function saveSettings(e) {
            e.preventDefault();
            const name = document.getElementById('set-name').value;
            await db.from('settings').upsert({ id: 1, name, logo: uploadedLogoBase64 });
            alert('تم الحفظ في قاعدة البيانات');
        }

        async function saveDepartment(e) {
            e.preventDefault();
            const id = document.getElementById('dept-id').value;
            const name = document.getElementById('dept-name').value;

            if(id) {
                await db.from('departments').update({ name }).eq('id', id);
            } else {
                await db.from('departments').insert([{ name }]);
            }

            document.getElementById('dept-name').value = '';
            document.getElementById('dept-id').value = '';
            await renderAdminDepartments();
        }

        async function renderAdminDepartments() {
            const { data: depts } = await db.from('departments').select('*');
            document.getElementById('departments-list').innerHTML = (depts || []).map(d => `
                <div class="flex justify-between items-center p-2 bg-slate-50 border rounded-lg text-xs">
                    <span>${d.name}</span>
                    <button onclick="deleteDepartment('${d.id}')" class="text-rose-600 font-bold">حذف</button>
                </div>
            `).join('');

            document.getElementById('doc-dept').innerHTML = (depts || []).map(d => `<option value="${d.name}">${d.name}</option>`).join('');
        }

        async function deleteDepartment(id) {
            if(confirm('هل أنت متأكد؟')) {
                await db.from('departments').delete().eq('id', id);
                await renderAdminDepartments();
            }
        }

        async function saveDoctor(e) {
            e.preventDefault();
            const id = document.getElementById('doc-id').value;
            const name = document.getElementById('doc-name').value;
            const department = document.getElementById('doc-dept').value;
            const username = document.getElementById('doc-username').value;
            const password = document.getElementById('doc-password').value;
            const days = document.getElementById('doc-days').value;
            const time_from = document.getElementById('doc-from').value;
            const time_to = document.getElementById('doc-to').value;

            if(id) {
                await db.from('doctors').update({ name, department, username, password, days, time_from, time_to }).eq('id', id);
            } else {
                await db.from('doctors').insert([{ name, department, username, password, days, time_from, time_to }]);
            }

            e.target.reset();
            document.getElementById('doc-id').value = '';
            await renderAdminDoctors();
        }

        async function renderAdminDoctors() {
            const { data: doctors } = await db.from('doctors').select('*');
            document.getElementById('doctors-list').innerHTML = (doctors || []).map(d => `
                <div class="p-2 bg-slate-50 border rounded-lg flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold">${d.name} (${d.department})</p>
                        <p class="text-[10px] text-slate-400">مستخدم: ${d.username}</p>
                    </div>
                    <button onclick="deleteDoctor('${d.id}')" class="text-rose-600 font-bold">حذف</button>
                </div>
            `).join('');
        }

        async function deleteDoctor(id) {
            if(confirm('هل أنت متأكد؟')) {
                await db.from('doctors').delete().eq('id', id);
                await renderAdminDoctors();
            }
        }

        async function renderAdminCases() {
            const { data: bookings } = await db.from('bookings').select('*');
            document.getElementById('cases-list').innerHTML = (bookings && bookings.length) ? bookings.map(b => `
                <div class="p-2 bg-slate-50 border rounded-lg text-xs flex justify-between items-center">
                    <div>
                        <p class="font-bold">${b.patient_name} (${b.status})</p>
                        <p class="text-[10px] text-slate-400">دكتور: ${b.doctor_name} | دور: ${b.queue_number}</p>
                    </div>
                    <button onclick="deleteCase('${b.id}')" class="text-rose-600 font-bold">حذف</button>
                </div>
            `).join('') : '<p class="text-xs text-slate-400">لا توجد حالات</p>';
        }

        async function deleteCase(id) {
            if(confirm('هل تريد حذف هذه الحالة؟')) {
                await db.from('bookings').delete().eq('id', id);
                await renderAdminCases();
            }
        }
    </script>
</body>
</html>
