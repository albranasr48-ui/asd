<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900">تسجيل دخول الإدارة</h2>
                <p class="text-xs text-slate-500 mt-1">أدخل كلمة المرور الخاصة بالمدير</p>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">كلمة المرور</label>
                    <input type="password" id="admin-pass" required placeholder="كلمة المرور (123)" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-teal-500">
                </div>
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-lg transition">دخول</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-dashboard" class="hidden min-h-screen flex flex-col">
        <!-- النابر العلوي -->
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-teal-800">لوحة التحكم الرئيسية - الإدارة</h1>
            <button onclick="logoutAdmin()" class="text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded-lg text-sm font-semibold transition">تسجيل خروج</button>
        </header>

        <!-- المحتوى -->
        <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-10">
            
            <!-- قسم الإعدادات -->
            <section class="bg-white p-6 rounded-2xl shadow-sm">
                <h3 class="text-lg font-bold text-slate-800 mb-4 border-r-4 border-teal-600 pr-3">إعدادات الموقع</h3>
                <form onsubmit="saveSettings(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">اسم العيادة</label>
                        <input type="text" id="set-name" required class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">رابط الشعار (صورة)</label>
                        <input type="url" id="set-logo" placeholder="https://..." class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                    <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 px-4 rounded-lg transition h-10">حفظ الإعدادات</button>
                </form>
            </section>

            <!-- قسم إدارة الأقسام -->
            <section class="bg-white p-6 rounded-2xl shadow-sm">
                <h3 class="text-lg font-bold text-slate-800 mb-4 border-r-4 border-teal-600 pr-3">إدارة الأقسام</h3>
                <form onsubmit="saveDepartment(event)" class="flex gap-3 mb-6">
                    <input type="hidden" id="dept-id">
                    <input type="text" id="dept-name" required placeholder="اسم القسم (مثال: قسم العيون)" class="flex-1 px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-teal-500">
                    <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded-lg font-semibold transition">حفظ القسم</button>
                </form>
                <div id="departments-list" class="space-y-2">
                    <!-- تعبئة الأقسام -->
                </div>
            </section>

            <!-- قسم إدارة الدكاترة -->
            <section class="bg-white p-6 rounded-2xl shadow-sm">
                <h3 class="text-lg font-bold text-slate-800 mb-4 border-r-4 border-teal-600 pr-3">إدارة الدكاترة</h3>
                <form onsubmit="saveDoctor(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    <input type="hidden" id="doc-id">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">اسم الدكتور</label>
                        <input type="text" id="doc-name" required class="w-full px-3 py-2 border rounded-lg outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">القسم</label>
                        <select id="doc-dept" required class="w-full px-3 py-2 border rounded-lg outline-none text-sm">
                            <!-- تعبئة القائمة -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">اسم المستخدم للدكتور</label>
                        <input type="text" id="doc-username" required class="w-full px-3 py-2 border rounded-lg outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">كلمة المرور للدكتور</label>
                        <input type="password" id="doc-password" required class="w-full px-3 py-2 border rounded-lg outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">الأيام</label>
                        <input type="text" id="doc-days" required placeholder="مثال: الأحد - الخميس" class="w-full px-3 py-2 border rounded-lg outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">التوقيت من</label>
                        <input type="text" id="doc-from" required placeholder="08:00 ص" class="w-full px-3 py-2 border rounded-lg outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">التوقيت إلى</label>
                        <input type="text" id="doc-to" required placeholder="02:00 م" class="w-full px-3 py-2 border rounded-lg outline-none text-sm">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 rounded-lg transition text-sm">حفظ الدكتور</button>
                    </div>
                </form>
                <div id="doctors-list" class="space-y-2">
                    <!-- تعبئة جدول الدكاترة -->
                </div>
            </section>

            <!-- قسم إدارة الحالات -->
            <section class="bg-white p-6 rounded-2xl shadow-sm">
                <h3 class="text-lg font-bold text-slate-800 mb-4 border-r-4 border-teal-600 pr-3">متابعة الحالات</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <h4 class="font-bold text-slate-700 mb-3 text-sm">قيد الانتظار</h4>
                        <div id="pending-cases-list" class="space-y-2 max-h-96 overflow-y-auto"></div>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-700 mb-3 text-sm">الحالات المكتملة</h4>
                        <div id="completed-cases-list" class="space-y-2 max-h-96 overflow-y-auto"></div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- نافذة إيصال للحالات في لوحة التحكم -->
    <div id="admin-invoice-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative">
            <div id="admin-invoice-content" class="p-4 border rounded-xl mb-4 bg-slate-50">
                <div class="text-center mb-4">
                    <h2 class="font-bold text-lg text-teal-800">إيصال حجز طبي</h2>
                </div>
                <div class="space-y-2 text-sm">
                    <p><strong>اسم المريض:</strong> <span id="adm-inv-name"></span></p>
                    <p><strong>رقم الهاتف:</strong> <span id="adm-inv-phone"></span></p>
                    <p><strong>القسم:</strong> <span id="adm-inv-dept"></span></p>
                    <p><strong>الدكتور:</strong> <span id="adm-inv-doctor"></span></p>
                    <p><strong>رقم العيادة:</strong> <span id="adm-inv-room"></span></p>
                    <p><strong>رقم الحالة:</strong> <span id="adm-inv-queue" class="text-teal-600 font-bold"></span></p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="downloadAdminPDF()" class="flex-1 bg-teal-600 text-white font-semibold py-2 rounded-lg text-sm">تنزيل PDF</button>
                <button onclick="closeAdminInvoice()" class="px-4 bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-sm">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if(pass === '123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadAdminData();
            } else {
                alert('كلمة المرور غير صحيحة (كلمة المرور هي 123)');
            }
        }

        function logoutAdmin() {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function loadAdminData() {
            loadSettingsForm();
            renderAdminDepartments();
            renderAdminDoctors();
            renderAdminCases();
        }

        // الإعدادات
        function loadSettingsForm() {
            const settings = JSON.parse(localStorage.getItem('clinic_settings')) || { name: 'عيادة سرت المركزية', logo: '' };
            document.getElementById('set-name').value = settings.name;
            document.getElementById('set-logo').value = settings.logo;
        }

        function saveSettings(e) {
            e.preventDefault();
            const name = document.getElementById('set-name').value;
            const logo = document.getElementById('set-logo').value;
            localStorage.setItem('clinic_settings', JSON.stringify({ name, logo }));
            alert('تم حفظ الإعدادات بنجاح');
        }

        // الأقسام
        function saveDepartment(e) {
            e.preventDefault();
            const id = document.getElementById('dept-id').value;
            const name = document.getElementById('dept-name').value;
            let depts = JSON.parse(localStorage.getItem('clinic_departments')) || [];

            if(id) {
                depts = depts.map(d => d.id === id ? { ...d, name } : d);
            } else {
                depts.push({ id: Date.now().toString(), name });
            }

            localStorage.setItem('clinic_departments', JSON.stringify(depts));
            document.getElementById('dept-name').value = '';
            document.getElementById('dept-id').value = '';
            renderAdminDepartments();
        }

        function renderAdminDepartments() {
            const depts = JSON.parse(localStorage.getItem('clinic_departments')) || [];
            const list = document.getElementById('departments-list');
            const select = document.getElementById('doc-dept');

            list.innerHTML = depts.map(d => `
                <div class="flex justify-between items-center p-3 bg-slate-50 border rounded-lg">
                    <span class="font-semibold">${d.name}</span>
                    <div class="space-x-2 space-x-reverse">
                        <button onclick="editDepartment('${d.id}', '${d.name}')" class="text-teal-600 hover:underline text-sm font-semibold">تعديل</button>
                        <button onclick="deleteDepartment('${d.id}')" class="text-rose-600 hover:underline text-sm font-semibold">حذف</button>
                    </div>
                </div>
            `).join('');

            select.innerHTML = depts.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
        }

        function editDepartment(id, name) {
            document.getElementById('dept-id').value = id;
            document.getElementById('dept-name').value = name;
        }

        function deleteDepartment(id) {
            if(confirm('هل أنت متأكد من الحذف؟')) {
                let depts = JSON.parse(localStorage.getItem('clinic_departments')) || [];
                depts = depts.filter(d => d.id !== id);
                localStorage.setItem('clinic_departments', JSON.stringify(depts));
                renderAdminDepartments();
            }
        }

        // الدكاترة
        function saveDoctor(e) {
            e.preventDefault();
            const id = document.getElementById('doc-id').value;
            const name = document.getElementById('doc-name').value;
            const department = document.getElementById('doc-dept').value;
            const username = document.getElementById('doc-username').value;
            const password = document.getElementById('doc-password').value;
            const days = document.getElementById('doc-days').value;
            const timeFrom = document.getElementById('doc-from').value;
            const timeTo = document.getElementById('doc-to').value;

            let doctors = JSON.parse(localStorage.getItem('clinic_doctors')) || [];

            if(id) {
                doctors = doctors.map(d => d.id === id ? { ...d, name, department, username, password, days, timeFrom, timeTo } : d);
            } else {
                doctors.push({ id: Date.now().toString(), name, department, username, password, days, timeFrom, timeTo, isPresent: false, roomNumber: '1', currentCase: 0, duration: 20 });
            }

            localStorage.setItem('clinic_doctors', JSON.stringify(doctors));
            e.target.reset();
            document.getElementById('doc-id').value = '';
            renderAdminDoctors();
        }

        function renderAdminDoctors() {
            const doctors = JSON.parse(localStorage.getItem('clinic_doctors')) || [];
            const list = document.getElementById('doctors-list');

            list.innerHTML = doctors.map(d => `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-3 bg-slate-50 border rounded-lg gap-2">
                    <div>
                        <h4 class="font-bold">${d.name} <span class="text-xs font-normal text-teal-700">(${d.department})</span></h4>
                        <p class="text-xs text-slate-500">المستخدم: ${d.username} | عيادة: ${d.roomNumber || 'غير محدد'} | ${d.days} (${d.timeFrom} - ${d.timeTo})</p>
                    </div>
                    <div class="space-x-2 space-x-reverse">
                        <button onclick="editDoctor('${d.id}')" class="text-teal-600 hover:underline text-sm font-semibold">تعديل</button>
                        <button onclick="deleteDoctor('${d.id}')" class="text-rose-600 hover:underline text-sm font-semibold">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        function editDoctor(id) {
            const doctors = JSON.parse(localStorage.getItem('clinic_doctors')) || [];
            const d = doctors.find(doc => doc.id === id);
            if(d) {
                document.getElementById('doc-id').value = d.id;
                document.getElementById('doc-name').value = d.name;
                document.getElementById('doc-dept').value = d.department;
                document.getElementById('doc-username').value = d.username;
                document.getElementById('doc-password').value = d.password;
                document.getElementById('doc-days').value = d.days;
                document.getElementById('doc-from').value = d.timeFrom;
                document.getElementById('doc-to').value = d.timeTo;
            }
        }

        function deleteDoctor(id) {
            if(confirm('هل أنت متأكد من الحذف؟')) {
                let doctors = JSON.parse(localStorage.getItem('clinic_doctors')) || [];
                doctors = doctors.filter(d => d.id !== id);
                localStorage.setItem('clinic_doctors', JSON.stringify(doctors));
                renderAdminDoctors();
            }
        }

        // الحالات
        function renderAdminCases() {
            const bookings = JSON.parse(localStorage.getItem('clinic_bookings')) || [];
            const pendingDiv = document.getElementById('pending-cases-list');
            const completedDiv = document.getElementById('completed-cases-list');

            const pending = bookings.filter(b => b.status === 'قيد الانتظار');
            const completed = bookings.filter(b => b.status === 'مكتملة');

            pendingDiv.innerHTML = pending.length ? pending.map(b => `
                <div class="p-3 bg-slate-50 border rounded-lg flex justify-between items-center text-sm">
                    <div>
                        <p class="font-bold">${b.patientName} <span class="text-xs text-teal-600 font-normal">(${b.doctorName})</span></p>
                        <p class="text-xs text-slate-500">هاتف: ${b.patientPhone} | الدور: ${b.queueNumber}</p>
                    </div>
                    <div class="space-x-1 space-x-reverse">
                        <button onclick="showAdminInvoice('${b.id}')" class="bg-teal-50 text-teal-700 px-2 py-1 rounded text-xs">إيصال</button>
                        <button onclick="deleteCase('${b.id}')" class="bg-rose-50 text-rose-700 px-2 py-1 rounded text-xs">حذف</button>
                    </div>
                </div>
            `).join('') : '<p class="text-xs text-slate-400">لا توجد حالات قيد الانتظار</p>';

            completedDiv.innerHTML = completed.length ? completed.map(b => `
                <div class="p-3 bg-slate-50 border rounded-lg flex justify-between items-center text-sm">
                    <div>
                        <p class="font-bold">${b.patientName} <span class="text-xs text-teal-600 font-normal">(${b.doctorName})</span></p>
                        <p class="text-xs text-slate-500">هاتف: ${b.patientPhone} | الدور: ${b.queueNumber}</p>
                    </div>
                    <button onclick="showAdminInvoice('${b.id}')" class="bg-teal-50 text-teal-700 px-2 py-1 rounded text-xs">إيصال</button>
                </div>
            `).join('') : '<p class="text-xs text-slate-400">لا توجد حالات مكتملة</p>';
        }

        function deleteCase(id) {
            if(confirm('هل تريد حذف هذه الحالة؟')) {
                let bookings = JSON.parse(localStorage.getItem('clinic_bookings')) || [];
                bookings = bookings.filter(b => b.id !== id);
                localStorage.setItem('clinic_bookings', JSON.stringify(bookings));
                renderAdminCases();
            }
        }

        let currentInv = null;
        function showAdminInvoice(id) {
            const bookings = JSON.parse(localStorage.getItem('clinic_bookings')) || [];
            currentInv = bookings.find(b => b.id === id);
            if(currentInv) {
                document.getElementById('adm-inv-name').innerText = currentInv.patientName;
                document.getElementById('adm-inv-phone').innerText = currentInv.patientPhone;
                document.getElementById('adm-inv-dept').innerText = currentInv.department;
                document.getElementById('adm-inv-doctor').innerText = currentInv.doctorName;
                document.getElementById('adm-inv-room').innerText = currentInv.roomNumber;
                document.getElementById('adm-inv-queue').innerText = currentInv.queueNumber;
                document.getElementById('admin-invoice-modal').classList.remove('hidden');
            }
        }

        function closeAdminInvoice() {
            document.getElementById('admin-invoice-modal').classList.add('hidden');
        }

        function downloadAdminPDF() {
            const element = document.getElementById('admin-invoice-content');
            html2pdf().from(element).save('Case-Invoice.pdf');
        }
    </script>
</body>
</html>
