<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">عيادة سرت المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-6">

    <!-- شريط علوي -->
    <header class="bg-white shadow-sm sticky top-0 z-40 px-4 py-3 border-b border-slate-200">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img id="clinic-logo" src="https://via.placeholder.com/40" alt="شعار" class="w-10 h-10 rounded-full object-cover border">
                <h1 id="clinic-name" class="text-base font-bold text-teal-800 truncate max-w-[150px]">عيادة سرت المركزية</h1>
            </div>
            <button onclick="openMyBookingsModal()" class="bg-teal-600 active:bg-teal-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-calendar-check"></i> حجوزاتي
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4">
        <!-- ترويسة -->
        <div class="bg-teal-700 text-white rounded-2xl p-4 mb-5 shadow-md">
            <h2 class="text-lg font-bold">مرحباً بك 👋</h2>
            <p class="text-xs text-teal-100 mt-1">اختر القسم وتعرف على الدكاترة المتاحين واحجز موعدك فوراً.</p>
        </div>

        <!-- الأقسام -->
        <div id="departments-section">
            <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-stethoscope text-teal-600"></i> الأقسام المتاحة
            </h3>
            <div id="departments-grid" class="space-y-2.5">
                <p class="text-xs text-slate-400 text-center py-4">جاري تحميل الأقسام...</p>
            </div>
        </div>

        <!-- قائمة الدكاترة -->
        <div id="doctors-section" class="hidden">
            <div class="flex items-center justify-between mb-3">
                <h3 id="selected-dept-title" class="text-sm font-bold text-slate-700">الدكاترة</h3>
                <button onclick="backToDepartments()" class="text-xs font-bold text-teal-600 flex items-center gap-1">
                    <i class="fa-solid fa-arrow-right"></i> العودة للأقسام
                </button>
            </div>
            <div id="doctors-grid" class="space-y-3"></div>
        </div>
    </main>

    <!-- نافذة إدخال بيانات الحجز -->
    <div id="booking-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md p-5 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-base font-bold text-slate-800">حجز موعد جديد</h3>
                <button onclick="closeBookingModal()" class="text-slate-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="booking-info-summary" class="bg-teal-50 border border-teal-100 p-3 rounded-xl mb-4 text-xs text-teal-900 space-y-1"></div>
            <form onsubmit="submitBooking(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">الاسم الكامل *</label>
                    <input type="text" id="patient-name" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">رقم الهاتف *</label>
                    <input type="tel" id="patient-phone" required placeholder="09XXXXXXXX" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">الجنس</label>
                        <select id="patient-gender" class="w-full px-3 py-2 border rounded-xl text-sm outline-none">
                            <option value="ذكر">ذكر</option>
                            <option value="أنثى">أنثى</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">العمر *</label>
                        <input type="number" id="patient-age" required class="w-full px-3 py-2 border rounded-xl text-sm outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ملاحظات (اختياري)</label>
                    <textarea id="patient-notes" rows="2" class="w-full px-3 py-2 border rounded-xl text-sm outline-none"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-teal-600 active:bg-teal-700 text-white font-bold py-3 rounded-xl text-sm transition">تأكيد الحجز</button>
            </form>
        </div>
    </div>

    <!-- نافذة حجوزاتي -->
    <div id="my-bookings-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md p-5 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-base font-bold text-slate-800">البحث عن حجوزاتي</h3>
                <button onclick="closeMyBookingsModal()" class="text-slate-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-2 mb-4">
                <input type="text" id="search-name" placeholder="الاسم الكامل" class="w-full px-3 py-2 border rounded-xl text-sm outline-none">
                <input type="tel" id="search-phone" placeholder="رقم الهاتف" class="w-full px-3 py-2 border rounded-xl text-sm outline-none">
                <button onclick="searchBookings()" class="w-full bg-teal-600 text-white py-2 rounded-xl text-sm font-bold">عرض الحجوزات</button>
            </div>
            <div id="my-bookings-results" class="space-y-2"></div>
        </div>
    </div>

    <!-- نافذة الفاتورة -->
    <div id="invoice-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-4 shadow-xl">
            <div id="invoice-content" class="p-3 border rounded-xl bg-slate-50 text-xs space-y-2">
                <div class="text-center pb-2 border-b">
                    <h2 id="inv-clinic" class="font-bold text-sm text-teal-800">عيادة سرت المركزية</h2>
                    <p class="text-[10px] text-slate-400">تأكيد حجز موعد</p>
                </div>
                <p><strong>اسم المريض:</strong> <span id="inv-name"></span></p>
                <p><strong>رقم الهاتف:</strong> <span id="inv-phone"></span></p>
                <p><strong>القسم:</strong> <span id="inv-dept"></span></p>
                <p><strong>الدكتور:</strong> <span id="inv-doctor"></span></p>
                <p><strong>رقم العيادة:</strong> <span id="inv-room"></span></p>
                <p><strong>رقم دورك:</strong> <span id="inv-queue" class="text-teal-600 font-bold text-sm"></span></p>
            </div>
            <div class="flex gap-2 mt-3">
                <button onclick="downloadPDF()" class="flex-1 bg-teal-600 text-white font-bold py-2 rounded-xl text-xs"><i class="fa-solid fa-download"></i> تنزيل PDF</button>
                <button onclick="closeInvoiceModal()" class="px-4 bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-xs">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://msfkzlgzrrwowzqswjeo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VrSSf2MML6_kII0uVt535w_kxtc62vQ';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            await loadSettings();
            await renderDepartments();
        });

        async function loadSettings() {
            const { data } = await db.from('settings').select('*').single();
            if (data) {
                document.getElementById('clinic-name').innerText = data.name || 'عيادة سرت المركزية';
                document.getElementById('page-title').innerText = data.name || 'عيادة سرت المركزية';
                if (data.logo) document.getElementById('clinic-logo').src = data.logo;
            }
        }

        async function renderDepartments() {
            const { data: depts } = await db.from('departments').select('*');
            const grid = document.getElementById('departments-grid');
            if (!depts || depts.length === 0) {
                grid.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">لا توجد أقسام مضافة بعد.</p>';
                return;
            }
            grid.innerHTML = depts.map(d => `
                <div onclick="selectDepartment('${d.name}')" class="bg-white p-3.5 rounded-xl shadow-sm border flex justify-between items-center active:scale-98 transition">
                    <span class="font-bold text-sm text-slate-800">${d.name}</span>
                    <i class="fa-solid fa-chevron-left text-xs text-slate-400"></i>
                </div>
            `).join('');
        }

        let currentSelectedDept = '';
        async function selectDepartment(deptName) {
            currentSelectedDept = deptName;
            document.getElementById('departments-section').classList.add('hidden');
            document.getElementById('doctors-section').classList.remove('hidden');
            document.getElementById('selected-dept-title').innerText = `دكاترة ${deptName}`;

            const { data: doctors } = await db.from('doctors').select('*').eq('department', deptName);
            const doctorsGrid = document.getElementById('doctors-grid');

            if (!doctors || doctors.length === 0) {
                doctorsGrid.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">لا يوجد أطباء مضافون حالياً في هذا القسم.</p>`;
                return;
            }

            const { data: bookings } = await db.from('bookings').select('*').eq('status', 'قيد الانتظار');

            doctorsGrid.innerHTML = doctors.map(doc => {
                const docBookings = (bookings || []).filter(b => b.doctor_username === doc.username);
                const currentCase = doc.current_case || 0;
                const totalInQueue = docBookings.length;

                return `
                    <div class="bg-white p-4 rounded-xl border shadow-sm space-y-2">
                        <div class="flex justify-between items-center">
                            <h4 class="font-bold text-sm text-slate-900">${doc.name}</h4>
                            ${doc.is_present 
                                ? '<span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full font-bold">موجود</span>' 
                                : '<span class="bg-rose-100 text-rose-800 text-[10px] px-2 py-0.5 rounded-full font-bold">غير موجود</span>'}
                        </div>
                        <div class="text-xs text-slate-600 space-y-1 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                            <p>🚪 <strong>عيادة رقم:</strong> ${doc.room_number || 'غير محدد'}</p>
                            <p>📅 <strong>المواعيد:</strong> ${doc.days || ''} (${doc.time_from || ''} - ${doc.time_to || ''})</p>
                            <p>🎯 <strong>واصل في الحالة:</strong> <strong class="text-teal-600">${currentCase}</strong></p>
                            <p>👥 <strong>حالات أمامك:</strong> ${totalInQueue}</p>
                            <p>⏱️ <strong>مدة الحالة:</strong> ${doc.duration || 20} دقيقة</p>
                        </div>
                        <button ${!doc.is_present ? 'disabled' : ''} onclick="openBookingModal('${doc.username}', '${doc.name}', '${doc.room_number}', ${doc.duration || 20})" class="w-full ${doc.is_present ? 'bg-teal-600 active:bg-teal-700 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'} py-2 rounded-xl text-xs font-bold transition">
                            ${doc.is_present ? 'حجز موعد' : 'غير متاح حالياً'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        function backToDepartments() {
            document.getElementById('doctors-section').classList.add('hidden');
            document.getElementById('departments-section').classList.remove('hidden');
        }

        let selectedDoctorData = {};
        async function openBookingModal(username, name, room, duration) {
            const { data: doc } = await db.from('doctors').select('*').eq('username', username).single();
            const { data: bookings } = await db.from('bookings').select('*').eq('doctor_username', username).eq('status', 'قيد الانتظار');
            
            const currentCase = doc ? (doc.current_case || 0) : 0;
            const queueNumber = currentCase + (bookings ? bookings.length : 0) + 1;

            selectedDoctorData = { username, name, room, queueNumber, department: currentSelectedDept };

            document.getElementById('booking-info-summary').innerHTML = `
                <p>👨‍⚕️ <strong>الدكتور:</strong> ${name}</p>
                <p>🚪 <strong>عيادة رقم:</strong> ${room}</p>
                <p>🔢 <strong>رقم حالتك المتوقع:</strong> <span class="text-teal-700 font-bold">${queueNumber}</span></p>
            `;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function closeBookingModal() {
            document.getElementById('booking-modal').classList.add('hidden');
        }

        async function submitBooking(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = 'جاري التأكيد...';

            const newBooking = {
                id: 'BK-' + Date.now(),
                patient_name: document.getElementById('patient-name').value,
                patient_phone: document.getElementById('patient-phone').value,
                gender: document.getElementById('patient-gender').value,
                age: document.getElementById('patient-age').value,
                notes: document.getElementById('patient-notes').value,
                department: selectedDoctorData.department,
                doctor_name: selectedDoctorData.name,
                doctor_username: selectedDoctorData.username,
                room_number: selectedDoctorData.room,
                queue_number: selectedDoctorData.queueNumber,
                status: 'قيد الانتظار'
            };

            await db.from('bookings').insert([newBooking]);

            btn.disabled = false;
            btn.innerText = 'تأكيد الحجز';
            closeBookingModal();
            showInvoice(newBooking);
        }

        function showInvoice(b) {
            document.getElementById('inv-name').innerText = b.patient_name;
            document.getElementById('inv-phone').innerText = b.patient_phone;
            document.getElementById('inv-dept').innerText = b.department;
            document.getElementById('inv-doctor').innerText = b.doctor_name;
            document.getElementById('inv-room').innerText = b.room_number;
            document.getElementById('inv-queue').innerText = b.queue_number;
            document.getElementById('invoice-modal').classList.remove('hidden');
        }

        function closeInvoiceModal() {
            document.getElementById('invoice-modal').classList.add('hidden');
            selectDepartment(currentSelectedDept);
        }

        function downloadPDF() {
            html2pdf().from(document.getElementById('invoice-content')).save('Receipt.pdf');
        }

        function openMyBookingsModal() {
            document.getElementById('my-bookings-modal').classList.remove('hidden');
        }

        function closeMyBookingsModal() {
            document.getElementById('my-bookings-modal').classList.add('hidden');
        }

        async function searchBookings() {
            const nameQuery = document.getElementById('search-name').value.trim();
            const phoneQuery = document.getElementById('search-phone').value.trim();
            const resultsDiv = document.getElementById('my-bookings-results');

            if(!nameQuery || !phoneQuery) {
                alert('الرجاء إدخال الاسم ورقم الهاتف');
                return;
            }

            const { data: bookings } = await db.from('bookings').select('*')
                .ilike('patient_name', `%${nameQuery}%`)
                .eq('patient_phone', phoneQuery)
                .eq('status', 'قيد الانتظار');

            if(!bookings || bookings.length === 0) {
                resultsDiv.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">لا توجد حجوزات نشطة بهذا الاسم والهاتف.</p>`;
                return;
            }

            resultsDiv.innerHTML = bookings.map(b => `
                <div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold text-slate-800">${b.doctor_name}</p>
                        <p class="text-slate-500">رقم الدور: <strong class="text-teal-600">${b.queue_number}</strong> | عيادة ${b.room_number}</p>
                    </div>
                    <button onclick="cancelBooking('${b.id}')" class="bg-rose-100 text-rose-700 px-2.5 py-1 rounded-lg font-bold">إلغاء</button>
                </div>
            `).join('');
        }

        async function cancelBooking(id) {
            if(confirm('هل تريد إلغاء الحجز؟')) {
                await db.from('bookings').delete().eq('id', id);
                searchBookings();
            }
        }
    </script>
</body>
</html>
