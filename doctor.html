<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الدكتور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .receipt-80mm {
            width: 80mm;
            padding: 10px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-6">

    <!-- شاشة تسجيل الدخول -->
    <div id="doctor-login-screen" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-xl">
            <h2 class="text-base font-bold text-slate-800 mb-3 text-center">دخول الدكتور</h2>
            <form onsubmit="handleDoctorLogin(event)" class="space-y-3">
                <input type="text" id="doc-login-user" required placeholder="اسم المستخدم" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-teal-500">
                <input type="password" id="doc-login-pass" required placeholder="كلمة المرور" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-teal-500">
                <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2 rounded-xl text-sm shadow">دخول</button>
            </form>
        </div>
    </div>

    <!-- الشاشة الرئيسية -->
    <div id="doctor-dashboard" class="hidden max-w-md mx-auto px-4 pt-4 space-y-4">
        <div class="flex justify-between items-center bg-white p-3 rounded-xl border shadow-sm">
            <div>
                <h1 id="doc-welcome-name" class="font-bold text-sm text-teal-800">أهلاً دكتور</h1>
                <p id="doc-dept-label" class="text-[10px] text-slate-400"></p>
            </div>
            <button onclick="logoutDoctor()" class="text-rose-600 text-xs font-bold bg-rose-50 px-2.5 py-1 rounded-lg">خروج</button>
        </div>

        <!-- إعدادات التواجد والعيادة -->
        <section class="bg-white p-4 rounded-xl border space-y-2 text-xs shadow-sm">
            <h3 class="font-bold text-slate-700">تحديث الحالة والعيادة</h3>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-slate-500 mb-1">التواجد</label>
                    <select id="doc-presence" class="w-full px-2 py-1.5 border rounded-lg outline-none">
                        <option value="true">موجود</option>
                        <option value="false">غير موجود</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-slate-500 mb-1">رقم العيادة</label>
                    <input type="text" id="doc-room" class="w-full px-2 py-1.5 border rounded-lg outline-none">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-slate-500 mb-1">مدة الحالة (دقائق)</label>
                    <input type="number" id="doc-duration" class="w-full px-2 py-1.5 border rounded-lg outline-none" value="20">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-500 mb-1">الحالة الواصل لها</label>
                    <input type="number" id="doc-current-case" class="w-full px-2 py-1.5 border rounded-lg outline-none" value="0">
                </div>
            </div>
            <button onclick="updateDoctorStatus()" class="w-full bg-teal-600 text-white font-bold py-2 rounded-lg mt-2 shadow-sm">حفظ التغييرات</button>
        </section>

        <!-- قائمة الحالات -->
        <section class="bg-white p-4 rounded-xl border space-y-3 shadow-sm">
            <h3 class="text-xs font-bold text-slate-700 flex items-center justify-between">
                <span>الحالات قيد الانتظار</span>
                <span class="text-[10px] text-teal-600 font-normal"><i class="fa-solid fa-circle text-[6px] text-emerald-500 animate-pulse"></i> محدث محلياً</span>
            </h3>
            <div id="doc-pending-cases" class="space-y-2"></div>
        </section>

        <section class="bg-white p-4 rounded-xl border space-y-3 shadow-sm">
            <h3 class="text-xs font-bold text-slate-700">الحالات المكتملة</h3>
            <div id="doc-completed-cases" class="space-y-2"></div>
        </section>
    </div>

    <!-- نافذة عرض الإيصال والتنزيل (80mm) -->
    <div id="invoice-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-xs p-4 shadow-xl flex flex-col items-center">
            <div id="invoice-content" class="receipt-80mm border border-dashed border-slate-300 rounded-lg text-center">
                <div class="flex flex-col items-center border-b pb-2 mb-2">
                    <img id="inv-logo" src="" class="w-12 h-12 rounded-full object-cover border mb-1 hidden">
                    <h2 id="inv-clinic" class="font-bold text-sm text-slate-900">عيادة سرت المركزية</h2>
                    <p class="text-[10px] text-slate-500">إيصال حجز موعد طبي</p>
                </div>
                
                <div class="bg-slate-100 p-2 rounded-md mb-2">
                    <p class="text-[10px] text-slate-500">الرقم التعريفي للحجز</p>
                    <p id="inv-code" class="text-lg font-black font-mono text-teal-700 tracking-wider">----</p>
                </div>

                <div class="text-right text-[11px] space-y-1.5 text-slate-800">
                    <p><strong>اسم المريض:</strong> <span id="inv-name"></span></p>
                    <p><strong>رقم الهاتف:</strong> <span id="inv-phone"></span></p>
                    <p><strong>القسم:</strong> <span id="inv-dept"></span></p>
                    <p><strong>الدكتور:</strong> <span id="inv-doctor"></span></p>
                    <p><strong>رقم العيادة:</strong> <span id="inv-room"></span></p>
                    <p class="pt-1 border-t"><strong>رقم دورك (الحالة):</strong> <span id="inv-queue" class="text-teal-700 font-bold text-xs"></span></p>
                </div>
            </div>

            <div class="flex gap-2 w-full mt-3">
                <button onclick="downloadPDF80mm()" class="flex-1 bg-teal-600 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1"><i class="fa-solid fa-print"></i> تنزيل PDF</button>
                <button onclick="closeInvoiceModal()" class="px-4 bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-xs">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://msfkzlgzrrwowzqswjeo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VrSSf2MML6_kII0uVt535w_kxtc62vQ';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentDoctorUsername = '';
        let autoRefreshInterval = null;
        let clinicName = 'عيادة سرت المركزية';
        let clinicLogo = '';

        async function handleDoctorLogin(e) {
            e.preventDefault();
            const user = document.getElementById('doc-login-user').value;
            const pass = document.getElementById('doc-login-pass').value;

            const { data: doc } = await db.from('doctors').select('*').eq('username', user).eq('password', pass).single();

            if(doc) {
                currentDoctorUsername = user;
                document.getElementById('doctor-login-screen').classList.add('hidden');
                document.getElementById('doctor-dashboard').classList.remove('hidden');
                
                const { data: settings } = await db.from('settings').select('*').single();
                if(settings) {
                    clinicName = settings.name || 'عيادة سرت المركزية';
                    clinicLogo = settings.logo || '';
                }

                await loadDoctorData();
                
                // تفعيل التحديث التلقائي المستمر كل ثانية
                if (autoRefreshInterval) clearInterval(autoRefreshInterval);
                autoRefreshInterval = setInterval(loadDoctorDataQuietly, 1000);
            } else {
                alert('بيانات الدخول غير صحيحة');
            }
        }

        function logoutDoctor() {
            currentDoctorUsername = '';
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            document.getElementById('doctor-dashboard').classList.add('hidden');
            document.getElementById('doctor-login-screen').classList.remove('hidden');
        }

        async function loadDoctorData() {
            const { data: doc } = await db.from('doctors').select('*').eq('username', currentDoctorUsername).single();

            if(doc) {
                document.getElementById('doc-welcome-name').innerText = `د. ${doc.name}`;
                document.getElementById('doc-dept-label').innerText = doc.department;
                document.getElementById('doc-presence').value = doc.is_present ? "true" : "false";
                document.getElementById('doc-room').value = doc.room_number || '1';
                document.getElementById('doc-duration').value = doc.duration || 20;
                document.getElementById('doc-current-case').value = doc.current_case || 0;
                await renderDoctorCases();
            }
        }

        // تحديث القوائم في الخلفية بشكل صامت كل ثانية
        async function loadDoctorDataQuietly() {
            if (!currentDoctorUsername) return;
            await renderDoctorCases();
        }

        async function updateDoctorStatus() {
            const is_present = document.getElementById('doc-presence').value === "true";
            const room_number = document.getElementById('doc-room').value;
            const duration = parseInt(document.getElementById('doc-duration').value) || 20;
            const current_case = parseInt(document.getElementById('doc-current-case').value) || 0;

            await db.from('doctors').update({ is_present, room_number, duration, current_case }).eq('username', currentDoctorUsername);

            alert('تم تحديث البيانات بنجاح');
            loadDoctorData();
        }

        async function renderDoctorCases() {
            const { data: docPending } = await db.from('bookings').select('*').eq('doctor_username', currentDoctorUsername).eq('status', 'قيد الانتظار');
            const { data: docCompleted } = await db.from('bookings').select('*').eq('doctor_username', currentDoctorUsername).eq('status', 'مكتملة');

            const pendingDiv = document.getElementById('doc-pending-cases');
            const completedDiv = document.getElementById('doc-completed-cases');

            pendingDiv.innerHTML = (docPending || []).length ? docPending.map(b => `
                <div class="p-2.5 bg-slate-50 border rounded-lg flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold">${b.patient_name} <span class="text-teal-600">(دور: ${b.queue_number})</span></p>
                        <p class="text-[10px] text-slate-400">هاتف: ${b.patient_phone} | رمز: ${b.track_code || '---'}</p>
                    </div>
                    <div class="flex gap-1">
                        <button onclick='showInvoice(${JSON.stringify(b)})' class="bg-amber-500 text-white font-bold px-2 py-1 rounded-md text-[10px]">إيصال</button>
                        <button onclick="markAsCompleted('${b.id}')" class="bg-teal-600 text-white font-bold px-2.5 py-1 rounded-md text-[10px]">مكتملة</button>
                    </div>
                </div>
            `).join('') : '<p class="text-[10px] text-slate-400">لا توجد حالات</p>';

            completedDiv.innerHTML = (docCompleted || []).length ? docCompleted.map(b => `
                <div class="p-2.5 bg-slate-50 border rounded-lg text-xs flex justify-between items-center">
                    <div>
                        <p class="font-bold">${b.patient_name}</p>
                        <p class="text-[10px] text-slate-400">رقم الدور: ${b.queue_number} | رمز: ${b.track_code || '---'}</p>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick='showInvoice(${JSON.stringify(b)})' class="bg-slate-200 text-slate-700 font-bold px-2 py-1 rounded-md text-[10px]">عرض الإيصال</button>
                        <span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full font-bold">مكتملة</span>
                    </div>
                </div>
            `).join('') : '<p class="text-[10px] text-slate-400">لا توجد حالات مكتملة</p>';
        }

        async function markAsCompleted(id) {
            await db.from('bookings').update({ status: 'مكتملة' }).eq('id', id);
            await renderDoctorCases();
        }

        function showInvoice(b) {
            document.getElementById('inv-clinic').innerText = clinicName;
            document.getElementById('inv-code').innerText = b.track_code || '8906';
            document.getElementById('inv-name').innerText = b.patient_name;
            document.getElementById('inv-phone').innerText = b.patient_phone;
            document.getElementById('inv-dept').innerText = b.department;
            document.getElementById('inv-doctor').innerText = b.doctor_name;
            document.getElementById('inv-room').innerText = b.room_number;
            document.getElementById('inv-queue').innerText = b.queue_number;

            if (clinicLogo) {
                const img = document.getElementById('inv-logo');
                img.src = clinicLogo;
                img.classList.remove('hidden');
            }

            document.getElementById('invoice-modal').classList.remove('hidden');
        }

        function closeInvoiceModal() {
            document.getElementById('invoice-modal').classList.add('hidden');
        }

        function downloadPDF80mm() {
            const element = document.getElementById('invoice-content');
            const opt = {
                margin:       2,
                filename:     `Receipt-${document.getElementById('inv-code').innerText}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: [80, 130], orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
